<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DroidLink Installer</title>
    <link rel="stylesheet" href="./styles.css?v=20260829" />
    <script
      type="module"
      src="https://unpkg.com/esp-web-tools@latest/dist/web/install-button.js"
    ></script>
  </head>
  <body>
    <div class="installer">
      <h1>DroidLink Installer</h1>

      <img
        id="device-logo"
        src="images/R2.png"
        alt="DroidLink Logo"
        class="logo logo-round"
      />

      <div class="card">
        <p class="firmware-heading">Current Firmware</p>

        <div class="firmware-select">
          <button
            onclick="selectFirmware('MASTER_V201')"
            id="btn-master_v201"
          >
            Master Controller V2.0.1 (Current)
          </button>

          <button onclick="selectFirmware('SLAVELATEST')" id="btn-slavelatest">
            Universal Slave V1.5
          </button>

          <button
            onclick="selectFirmware('DISPLAY_AMOLED_V2')"
            id="btn-display_amoled_v2"
          >
            Watch Display V2.0.0 (Current)
          </button>

          <button onclick="selectFirmware('SLAVEASTRO')" id="btn-slaveastro">
            AstroPixels V1.4
          </button>

          <button onclick="selectFirmware('MAGICPANEL')" id="btn-magicpanel">
            MagicPanel V1.0
          </button>

          <button onclick="selectFirmware('PERISCOPE')" id="btn-periscope">
            Periscope V1.0
          </button>
        </div>

        <div class="installer-options-row">
          <label class="license-entry">
            License Key:
            <input id="license" />
          </label>

          <div class="legacy-entry">
            <span class="option-label">Previous Firmware:</span>
            <details class="previous-firmware">
              <summary>Previous and Legacy Firmware</summary>
              <div class="previous-firmware-list">
              <button
                onclick="selectFirmware('MASTER_V2')"
                id="btn-master_v2"
              >
                Master Controller V2.0.0
              </button>

              <button onclick="selectFirmware('MASTER')" id="btn-master">
                Master Controller V1.6
              </button>

              <button onclick="selectFirmware('SLAVE')" id="btn-slave">
                Universal Slave V1.2
              </button>

              <button
                onclick="selectFirmware('DISPLAY_AMOLED')"
                id="btn-display_amoled"
              >
                Watch Display V1.3
              </button>

              <button onclick="selectFirmware('DISPLAY')" id="btn-display">
                Original Round Display V1.0
              </button>
              </div>
            </details>
          </div>
        </div>

        <esp-web-install-button id="install" class="install-btn">
          <button slot="activate">Install Firmware</button>
        </esp-web-install-button>
      </div>

      <div class="footer-link">
        <a
          href="https://www.youtube.com/watch?v=jiLfbigjiPc&t=7s"
          target="_blank"
          rel="noopener noreferrer"
        >
          Click Here for Installation Video.
        </a>
      </div>

      <div class="footer-link">
        <a
          href="https://linktr.ee/droidlink"
          target="_blank"
          rel="noopener noreferrer"
        >
          Click Here for Part list
        </a>
      </div>
    </div>

    <script>
      const button = document.getElementById("install");
      let selectedFirmware = null;
      let activeLicense = "";
      let installSessionId = "";
      const gatekeeperHost = "droidlink-gatekeeper.fmoore1124.workers.dev";
      const originalFetch = window.fetch.bind(window);

      // Only send private authorization data to DroidLink Gatekeeper.
      window.fetch = (resource, options = {}) => {
        const requestUrl = new URL(
          resource instanceof Request ? resource.url : resource,
          window.location.href,
        );

        if (requestUrl.hostname !== gatekeeperHost || !activeLicense) {
          return originalFetch(resource, options);
        }

        const headers = new Headers(
          resource instanceof Request ? resource.headers : undefined,
        );
        new Headers(options.headers || {}).forEach((value, name) => {
          headers.set(name, value);
        });
        headers.set("x-license-key", activeLicense);
        headers.set("x-install-session-id", installSessionId);

        return originalFetch(resource, { ...options, headers }).then(
          (response) => {
            if (response.status === 403) {
              throw new Error(
                "Update Access Required. Your DroidLink license does not currently have access to this firmware. Please contact DroidLink Support if you believe this is incorrect.",
              );
            }

            return response;
          },
        );
      };

      function selectFirmware(type) {
        const logo = document.getElementById("device-logo");
        logo.style.display = "";
        logo.classList.remove("logo-round");

        // Clear active buttons
        [
          "master",
          "master_v2",
          "master_v201",
          "slave",
          "slavelatest",
          "display",
          "display_amoled",
          "display_amoled_v2",
          "slaveastro",
          "magicpanel",
          "periscope",
        ].forEach((id) => {
          document.getElementById("btn-" + id).classList.remove("active");
        });

        switch (type) {
          case "MASTER":
          case "MASTER_V2":
          case "MASTER_V201":
            logo.src = "images/master.jpeg";
            break;

          case "SLAVE":
          case "SLAVELATEST":
          case "SLAVEASTRO":
            logo.src = "images/slave.jpeg";
            break;

          case "DISPLAY":
            logo.src = "images/display.jpeg";
            break;

          case "MAGICPANEL":
          case "PERISCOPE":
            logo.style.display = "none";
            break;

          case "DISPLAY_AMOLED":
          case "DISPLAY_AMOLED_V2":
            logo.src = "images/display_amoled.jpeg";
            break;
        }

        selectedFirmware = type;

        document
          .getElementById("btn-" + type.toLowerCase())
          .classList.add("active");
      }

      button.addEventListener("click", () => {
        const license = document.getElementById("license").value.trim();

        if (!license) {
          alert("License key required");
          return;
        }

        if (!selectedFirmware) {
          alert("Select firmware type");
          return;
        }

        // One ID represents one click of Install Firmware. All binary files
        // requested by this installation use the same ID.
        activeLicense = license;
        installSessionId = crypto.randomUUID();

        // ✅ FIXED LINE
        button.manifest = `https://droidlink.github.io/DroidLink_Installer/manifest/${selectedFirmware.toLowerCase()}.json?v=20260829`;
      });
    </script>
  </body>
</html>
